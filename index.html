<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuestra Boda 💍</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap");

      body {
        font-family: "Poppins", sans-serif;
        background: linear-gradient(135deg, #fdeff9, #ec38bc, #7303c0);
        background-size: 400% 400%;
        animation: gradient 12s ease infinite;
        color: #fff;
        text-align: center;
        padding: 0;
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }

      @keyframes gradient {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 0.5rem;
      }

      p {
        font-size: 1.2rem;
        margin-top: 0;
      }

      .personal-message {
        background: rgba(255, 255, 255, 0.15);
        padding: 12px 20px;
        border-radius: 15px;
        font-size: 1.1rem;
        margin-top: 15px;
        display: inline-block;
      }

      .countdown {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
        font-size: 1.5rem;
      }

      .countdown div {
        background: rgba(255, 255, 255, 0.2);
        padding: 15px 20px;
        border-radius: 15px;
        min-width: 80px;
      }

      .whatsapp-btn {
        display: inline-block;
        background-color: white;
        color: black;
        padding: 8px 20px;
        border-radius: 25px;
        font-size: 1rem;
        font-weight: 500;
        text-decoration: none;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
        transition: all 0.3s ease;
        margin-top: 25px;
      }

      .whatsapp-btn:hover {
        background-color: lightgray;
        transform: scale(1.05);
      }

      .footer {
        position: absolute;
        bottom: 15px;
        width: 100%;
        font-size: 1.8rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <h1>💍 Nuestra Boda 💍</h1>
    <p><strong>Lugar:</strong> Jardín Los Pinos</p>
    <p><strong>Fecha:</strong> 22 de Noviembre de 2025</p>
    <p><strong>Hora:</strong> 07:00 p.m</p>

    <!-- Mensaje personalizado -->
    <div
      id="personalMessage"
      class="personal-message"
      style="display: none"
    ></div>

    <!-- Cuenta regresiva -->
    <div class="countdown" id="countdown">
      <div><span id="days">0</span><br />días</div>
      <div><span id="hours">0</span><br />horas</div>
      <div><span id="minutes">0</span><br />minutos</div>
      <div><span id="seconds">0</span><br />segundos</div>
    </div>

    <!-- Botón de WhatsApp -->
    <a id="whatsapp-link" target="_blank" class="whatsapp-btn">
      📱 Confirmar asistencia
    </a>

    <div class="footer">Con amor, <strong>Martín & Lucía</strong> 💕</div>

    <script>
      // ==============================
      // 🎯 CONFIGURACIÓN GENERAL
      // ==============================
      const numeroWhatsApp = "6311008691"; // ← cambia este número

      // Fecha de la boda
      const weddingDate = new Date("November 22, 2025 19:00:00").getTime();

      // ==============================
      // ⏰ CUENTA REGRESIVA
      // ==============================
      const timer = setInterval(() => {
        const now = new Date().getTime();
        const distance = weddingDate - now;

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)
        );
        const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = days;
        document.getElementById("hours").innerText = hours;
        document.getElementById("minutes").innerText = minutes;
        document.getElementById("seconds").innerText = seconds;

        if (distance < 0) {
          clearInterval(timer);
          document.getElementById("countdown").innerHTML =
            "<h2>¡Ya llegó el gran día! 💖</h2>";
        }
      }, 1000);

      // ==============================
      // 💌 MENSAJE PERSONALIZADO
      // ==============================
      const params = new URLSearchParams(window.location.search);
      const nombre = params.get("nombre");
      const invitados = params.get("invitados");

      if (nombre && invitados) {
        const mensaje = `💌 Hola <strong>${nombre}</strong>, esta invitación es para <strong>${invitados}</strong> persona${
          invitados > 1 ? "s" : ""
        }.`;
        const mensajeDiv = document.getElementById("personalMessage");
        mensajeDiv.innerHTML = mensaje;
        mensajeDiv.style.display = "inline-block";
      }

      // ==============================
      // 💬 ENLACE DE WHATSAPP
      // ==============================
      const mensajeWhatsApp = `¡Hola! Soy ${
        nombre || "invitado"
      } y quiero confirmar mi asistencia para ${invitados || 1} persona${
        (invitados || 1) > 1 ? "s" : ""
      } a la boda `;

      document.getElementById(
        "whatsapp-link"
      ).href = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(
        mensajeWhatsApp
      )}`;
    </script>
  </body>
</html>
